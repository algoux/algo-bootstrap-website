<!DOCTYPE html>
<html>
<head>
    <title>架构检测测试</title>
</head>
<body>
    <h1>架构检测测试</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function addResult(label, value) {
            const p = document.createElement('p');
            p.innerHTML = `<strong>${label}:</strong> ${value}`;
            results.appendChild(p);
        }

        addResult('navigator.userAgent', navigator.userAgent);
        addResult('navigator.platform', navigator.platform);

        if ('userAgentData' in navigator) {
            const userAgentData = navigator.userAgentData;
            addResult('navigator.userAgentData', JSON.stringify(userAgentData));

            if (userAgentData && typeof userAgentData.getHighEntropyValues === 'function') {
                userAgentData.getHighEntropyValues(['architecture']).then(data => {
                    addResult('High Entropy Architecture', JSON.stringify(data));
                }).catch(error => {
                    addResult('High Entropy Error', error.message);
                });
            }
        } else {
            addResult('navigator.userAgentData', 'Not supported');
        }

        // WebGL 检测
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    addResult('WebGL Renderer', renderer);
                }
            }
        } catch (error) {
            addResult('WebGL Error', error.message);
        }

        addResult('devicePixelRatio', window.devicePixelRatio);
        addResult('screen.width x screen.height', `${screen.width} x ${screen.height}`);
    </script>
</body>
</html>
